<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Único - Sistema de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-wrapper">
    <div class="card auth-card">
        <div class="auth-header">
            <i class="bi bi-egg-fried auth-brand-icon"></i>
            <h1 class="auth-title">Sabor Único</h1>
            <p class="auth-subtitle mb-0">Sistema Integral de Gestión Gastronómica</p>
        </div>
        <div class="card-body p-4 text-center">
            <p class="text-muted mb-4">
                Administra comandas, inventario, caja y facturación 
                desde una plataforma segura y multi-rol.
            </p>
            <a href="{{ url_for('auth.login') }}" class="btn btn-auth w-100 rounded-pill text-white">
                <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
            </a>
            <p class="small text-muted mt-3 mb-0">Acceso restringido a personal autorizado</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
