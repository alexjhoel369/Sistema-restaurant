openapi: 3.0.0
info:
  title: Sistema Restaurante API
  version: 1.0.0
  description: Documentación de endpoints del sistema de gestión de restaurante

paths:

  /:
    post:
      summary: Login de usuario
      responses:
        '200':
          description: Login exitoso

  /logout:
    get:
      summary: Cerrar sesión
      responses:
        '200':
          description: Sesión cerrada

  /dashboard:
    get:
      summary: Panel principal
      responses:
        '200':
          description: Vista del dashboard

  /productos:
    get:
      summary: Listar productos
      responses:
        '200':
          description: Lista de productos

  /productos/crear:
    post:
      summary: Crear producto
      responses:
        '200':
          description: Producto creado

  /mesas:
    get:
      summary: Listar mesas
      responses:
        '200':
          description: Lista de mesas

  /comandas/{id}:
    get:
      summary: Ver comanda
      parameters:
        - name: id
          in: path
          required: true
      responses:
        '200':
          description: Detalle de comanda

  /inventario:
    get:
      summary: Ver inventario
      responses:
        '200':
          description: Inventario listado

  /reportes:
    get:
      summary: Ver reportes
      responses:
        '200':
          description: Reportes generados
